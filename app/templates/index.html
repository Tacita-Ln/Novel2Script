<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel2Script</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .sub {
            color: #5a6e7c;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            padding-left: 12px;
        }
        .three-columns {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        .col {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: auto;
        }
        .col-left { flex: 1.2; }
        .col-mid { flex: 1.5; }
        .col-right { flex: 1; }
        
        .panel-title {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        textarea, .editable-yaml {
            width: 100%;
            flex: 1;
            font-family: 'Courier New', monospace;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            margin-bottom: 15px;
            font-size: 14px;
            background: #1e293b;
            color: #e2e8f0;
            white-space: pre-wrap;
            overflow: auto;
        }
        .file-upload {
            margin: 10px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-upload input[type="file"] { flex: 1; }
        .mode-check {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            margin-right: 10px;
        }
        button:hover { background: #2980b9; }
        .export-btn { background: #2ecc71; }
        .export-btn:hover { background: #27ae60; }
        .clear-btn { background: #e67e22; }
        .clear-btn:hover { background: #d35400; }
        .ask-btn { background: #8e44ad; }
        .ask-btn:hover { background: #6c3483; }
        .apply-btn { background: #27ae60; }
        .apply-btn:hover { background: #1e8449; }
        .clear-history-btn { background: #e74c3c; padding: 4px 12px; font-size: 12px; }
        .error {
            color: #e74c3c;
            background: #fef3f2;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
        }
        .info {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            color: #3b4e5e;
        }
        .loading {
            display: inline-block;
            margin-left: 10px;
            color: #f39c12;
        }
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filename-input {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .filename-input input {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px 8px;
            width: 140px;
            font-size: 13px;
        }
        hr { margin: 15px 0; }
        .ask-container {
            margin-top: 12px;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
        }
        .ask-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .ask-input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .answer-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            display: none;
        }
        .history-list {
            flex: 1;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
        }
        .history-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
            background: white;
        }
        .history-header {
            padding: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            border-radius: 8px 8px 0 0;
        }
        .history-header:hover { background: #e2e8f0; }
        .history-info { flex: 1; }
        .history-actions button { margin-left: 4px; padding: 2px 8px; font-size: 11px; }
        .history-conversations {
            padding: 8px;
            border-top: 1px solid #e2e8f0;
            background: #fefce8;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .conv-item {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #cbd5e1;
        }
        .conv-question { font-weight: bold; color: #8e44ad; }
        .conv-answer { margin-top: 4px; color: #2c3e50; }
        .conv-yaml { font-family: monospace; background: #1e293b; color: #e2e8f0; padding: 4px; margin-top: 4px; font-size: 11px; white-space: pre-wrap; }
    </style>
    <!-- 引入 js-yaml 用于解析 title -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
    <h1>📖 Novel2Script · AI 小说转剧本工具</h1>
    <div class="sub">基于智谱 GLM-4.5-Air，将小说（≥3章）转换为结构化 YAML 剧本 | 支持在线编辑剧本 | 可追问打磨，历史含问答 | 导出可自定义文件名</div>

    <div class="three-columns">
        <!-- 左栏：导入区 -->
        <div class="col col-left">
            <div class="panel-title">📂 1. 导入小说</div>
            <textarea id="inputText" placeholder="请在此粘贴至少包含3章的小说内容（支持第X章格式）..."></textarea>
            
            <div class="file-upload">
                <input type="file" id="fileInput" multiple accept=".txt,.md,.docx">
                <button id="loadFileBtn">📄 加载文件</button>
                <label class="mode-check">
                    <input type="checkbox" id="appendMode"> 📎 追加到当前内容
                </label>
                <button id="clearTextBtn" class="clear-btn">🗑️ 清空</button>
            </div>

            <div class="action-bar">
                <button id="convertBtn">✨ 转换为剧本 YAML</button>
                <span id="loadingMsg" class="loading"></span>
            </div>
            <div id="errorMsg" class="error" style="display:none;"></div>
            <div class="info">
                <strong>💡 要求</strong><br>
                • 至少3个章节<br>
                • 输出无emotion字段的YAML<br>
                • 支持 .txt, .md, .docx 多文件<br>
                • 中栏YAML可直接编辑，修改后导出/追问基于编辑后内容<br>
                • 右侧历史含问答，支持加载历史
            </div>
        </div>

        <!-- 中栏：可编辑剧本 + 追问打磨 -->
        <div class="col col-mid">
            <div class="panel-title">🎬 2. 剧本输出 (YAML) - 可直接编辑</div>
            <textarea id="yamlOutput" class="editable-yaml" placeholder="等待转换..."></textarea>
            <div class="action-bar">
                <div class="filename-input">
                    <span>📝 导出文件名：</span>
                    <input type="text" id="exportFilename" placeholder="不含后缀" value="script">
                </div>
                <button id="exportBtn" class="export-btn" disabled>💾 导出 YAML</button>
                <button id="copyBtn">📋 复制到剪贴板</button>
            </div>

            <div class="ask-container">
                <div class="panel-title">💬 3. 追问打磨</div>
                <div class="ask-input-group">
                    <input type="text" id="askInput" placeholder="例如：请把第二场的地点改为咖啡馆，或者：检查主角情绪是否连贯...">
                    <button id="askBtn" class="ask-btn">🤔 提问 / 修改</button>
                </div>
                <div id="answerBox" class="answer-box"></div>
            </div>
        </div>

        <!-- 右栏：历史记录 -->
        <div class="col col-right">
            <div class="panel-title">
                <span>🕒 历史记录</span>
                <button id="clearHistoryBtn" class="clear-history-btn">清空历史</button>
            </div>
            <div id="historyList" class="history-list">
                <div style="color: #888; text-align: center;">暂无历史记录</div>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const inputText = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const loadFileBtn = document.getElementById('loadFileBtn');
        const clearTextBtn = document.getElementById('clearTextBtn');
        const appendModeCheck = document.getElementById('appendMode');
        const convertBtn = document.getElementById('convertBtn');
        const yamlOutputTextarea = document.getElementById('yamlOutput');
        const exportBtn = document.getElementById('exportBtn');
        const copyBtn = document.getElementById('copyBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsgDiv = document.getElementById('errorMsg');
        const askInput = document.getElementById('askInput');
        const askBtn = document.getElementById('askBtn');
        const answerBox = document.getElementById('answerBox');
        const historyListDiv = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const exportFilenameInput = document.getElementById('exportFilename');
        
        let currentYamlString = '';      // 始终与 textarea 同步
        let currentHistoryId = null;
        let pendingNewYaml = null;

        // 同步 textarea 内容到 currentYamlString
        function syncYamlFromEditor() {
            currentYamlString = yamlOutputTextarea.value;
            // 每次编辑后，尝试从YAML提取title并更新默认文件名
            updateDefaultFilenameFromYaml();
        }
        yamlOutputTextarea.addEventListener('input', syncYamlFromEditor);

        // 从 YAML 中提取 title 作为默认文件名（不覆盖用户已手动修改的输入）
        let lastAutoFilename = '';
        function updateDefaultFilenameFromYaml() {
            if (!currentYamlString) return;
            // 如果用户已经手动修改了文件名输入框且不是上次自动设置的值，则不再覆盖
            const currentInputVal = exportFilenameInput.value.trim();
            if (currentInputVal !== '' && currentInputVal !== lastAutoFilename && currentInputVal !== 'script') {
                // 用户自己输入了，保留用户输入
                return;
            }
            try {
                const parsed = jsyaml.load(currentYamlString);
                if (parsed && parsed.title) {
                    let title = parsed.title.replace(/[\\/:*?"<>|]/g, '');
                    if (title) {
                        exportFilenameInput.value = title;
                        lastAutoFilename = title;
                        return;
                    }
                }
            } catch(e) { /* 忽略解析错误 */ }
            // 没有title或解析失败则使用默认 script
            if (exportFilenameInput.value === '' || exportFilenameInput.value === lastAutoFilename) {
                exportFilenameInput.value = 'script';
                lastAutoFilename = 'script';
            }
        }

        // 设置 YAML 内容（同时更新 textarea 和变量）
        function setYamlContent(newYaml) {
            currentYamlString = newYaml;
            yamlOutputTextarea.value = newYaml;
            exportBtn.disabled = false;
            updateDefaultFilenameFromYaml();
        }

        // ========== 历史记录管理（含问答）==========
        const STORAGE_KEY = 'Novel2Script_history_with_qa';
        const MAX_HISTORY = 10;

        function saveConversionHistory(inputSummary, yamlStr) {
            const record = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                summary: inputSummary.substring(0, 80),
                yaml: yamlStr,
                conversations: []
            };
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history.unshift(record);
            if (history.length > MAX_HISTORY) history.pop();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            currentHistoryId = record.id;
            renderHistory();
            return record.id;
        }

        function addConversationToCurrent(question, answer, newYaml = null) {
            if (!currentHistoryId) return;
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const recordIndex = history.findIndex(r => r.id === currentHistoryId);
            if (recordIndex === -1) return;
            history[recordIndex].conversations.push({
                timestamp: new Date().toLocaleString(),
                question: question,
                answer: answer,
                newYaml: newYaml
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
        }

        function updateHistoryYaml(historyId, newYaml) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const record = history.find(r => r.id === historyId);
            if (record) {
                record.yaml = newYaml;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (history.length === 0) {
                historyListDiv.innerHTML = '<div style="color: #888; text-align: center;">暂无历史记录</div>';
                return;
            }
            let html = '';
            for (const record of history) {
                const convCount = record.conversations.length;
                html += `
                    <div class="history-item" data-id="${record.id}">
                        <div class="history-header">
                            <div class="history-info">
                                <strong>${escapeHtml(record.timestamp)}</strong><br>
                                <span style="font-size: 11px; color: #4a5568;">${escapeHtml(record.summary)}</span>
                                ${convCount > 0 ? `<span style="margin-left: 8px; background: #8e44ad; color: white; padding: 2px 6px; border-radius: 12px; font-size: 10px;">💬 ${convCount}</span>` : ''}
                            </div>
                            <div class="history-actions">
                                <button class="load-history-btn">加载</button>
                                <button class="toggle-conv-btn">${convCount > 0 ? '展开问答' : '无问答'}</button>
                            </div>
                        </div>
                        <div class="history-conversations" style="display: none;">
                            ${renderConversations(record.conversations)}
                        </div>
                    </div>
                `;
            }
            historyListDiv.innerHTML = html;
            
            document.querySelectorAll('.load-history-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const parent = btn.closest('.history-item');
                    const id = parseInt(parent.getAttribute('data-id'));
                    loadHistoryById(id);
                });
            });
            document.querySelectorAll('.toggle-conv-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const parent = btn.closest('.history-item');
                    const convDiv = parent.querySelector('.history-conversations');
                    if (convDiv.style.display === 'none') {
                        convDiv.style.display = 'block';
                        btn.textContent = '收起问答';
                    } else {
                        convDiv.style.display = 'none';
                        btn.textContent = `展开问答 (${parent.querySelectorAll('.conv-item').length})`;
                    }
                });
            });
        }

        function renderConversations(convs) {
            if (!convs.length) return '<div style="color: #888; padding: 4px;">暂无追问记录</div>';
            let html = '';
            for (const conv of convs) {
                html += `
                    <div class="conv-item">
                        <div class="conv-question">❓ ${escapeHtml(conv.question)}</div>
                        <div class="conv-answer">📝 ${escapeHtml(conv.answer).replace(/\n/g, '<br>')}</div>
                        ${conv.newYaml ? `<div class="conv-yaml">✨ 修改后YAML预览：<br>${escapeHtml(conv.newYaml.substring(0, 200))}${conv.newYaml.length > 200 ? '...' : ''}</div>` : ''}
                        <div style="font-size: 10px; color: #888;">${conv.timestamp}</div>
                    </div>
                `;
            }
            return html;
        }

        function loadHistoryById(id) {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const record = history.find(r => r.id === id);
            if (record) {
                setYamlContent(record.yaml);
                currentHistoryId = id;
                showError('', true);
                // 临时提示
                const msg = document.createElement('div');
                msg.textContent = '✅ 已加载历史剧本及关联问答';
                msg.style.color = '#27ae60';
                msg.style.fontSize = '12px';
                const header = document.querySelector(`.history-item[data-id="${id}"] .history-header`);
                if (header) header.appendChild(msg);
                setTimeout(() => msg.remove(), 2000);
            }
        }

        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                currentHistoryId = null;
                renderHistory();
            }
        }
        clearHistoryBtn.addEventListener('click', clearHistory);

        // ========== 辅助函数 ==========
        function showError(msg, clear = false) {
            if (clear || !msg) {
                errorMsgDiv.style.display = 'none';
                errorMsgDiv.textContent = '';
            } else {
                errorMsgDiv.textContent = msg;
                errorMsgDiv.style.display = 'block';
            }
        }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
                if (ext === '.txt' || ext === '.md') {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('文件读取失败'));
                    reader.readAsText(file, 'UTF-8');
                } else if (ext === '.docx') {
                    const formData = new FormData();
                    formData.append('file', file);
                    fetch('/parse_docx', { method: 'POST', body: formData })
                        .then(res => res.json())
                        .then(data => {
                            if (data.text) resolve(data.text);
                            else reject(new Error(data.error || '解析docx失败'));
                        })
                        .catch(reject);
                } else reject(new Error('不支持的文件类型'));
            });
        }

        loadFileBtn.addEventListener('click', async () => {
            const files = Array.from(fileInput.files);
            if (!files.length) { showError('请先选择文件'); return; }
            let allText = '';
            for (const file of files) {
                try {
                    let content = await readFileContent(file);
                    if (content && !content.endsWith('\n')) content += '\n';
                    allText += content;
                } catch (err) {
                    showError(`读取文件 "${file.name}" 失败: ${err.message}`);
                    return;
                }
            }
            if (allText.endsWith('\n')) allText = allText.slice(0, -1);
            if (appendModeCheck.checked) {
                let cur = inputText.value;
                if (cur && !cur.endsWith('\n')) cur += '\n';
                inputText.value = cur + allText;
            } else {
                inputText.value = allText;
            }
            showError('', true);
        });
        clearTextBtn.addEventListener('click', () => { inputText.value = ''; showError('', true); });

        // 转换逻辑
        convertBtn.addEventListener('click', async () => {
            const novel = inputText.value.trim();
            if (!novel) { showError('请输入小说内容'); return; }
            const chapterMatches = novel.match(/第[一二三四五六七八九十0-9]+章/g);
            const uniqueChapters = chapterMatches ? new Set(chapterMatches).size : 0;
            
            async function sendConversion(force = false) {
                loadingMsg.textContent = '转换中...';
                convertBtn.disabled = true;
                showError('', true);
                setYamlContent('⏳ 正在调用模型...');
                answerBox.style.display = 'none';
                answerBox.innerHTML = '';
                pendingNewYaml = null;
                const formData = new FormData();
                formData.append('novel_text', novel);
                if (force) formData.append('force_convert', 'true');
                try {
                    const res = await fetch('/convert', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (res.ok && data.yaml) {
                        setYamlContent(data.yaml);
                        saveConversionHistory(novel.substring(0, 80), currentYamlString);
                    } else if (data.error_type === 'insufficient_chapters') {
                        const confirm = window.confirm(`⚠️ ${data.error}\n\n是否仍要继续转换？`);
                        if (confirm) await sendConversion(true);
                        else { setYamlContent('❌ 已取消'); showError(data.error); }
                    } else throw new Error(data.error || '转换失败');
                } catch (err) {
                    setYamlContent(`❌ 错误：${err.message}`);
                    showError(err.message);
                } finally {
                    loadingMsg.textContent = '';
                    convertBtn.disabled = false;
                }
            }
            if (uniqueChapters >= 3) await sendConversion(false);
            else {
                const confirm = window.confirm(`检测到 ${uniqueChapters} 个不同章节，建议至少3章。\n是否仍要继续？`);
                if (confirm) await sendConversion(true);
                else showError('已取消，请增加章节');
            }
        });

        // 导出 YAML 文件（支持自定义文件名）
        exportBtn.addEventListener('click', () => {
            if (!currentYamlString || currentYamlString === '等待转换...') return;
            let filename = exportFilenameInput.value.trim();
            if (filename === '') filename = 'script';
            // 去除非法字符
            filename = filename.replace(/[\\/:*?"<>|]/g, '');
            if (!filename.endsWith('.yaml')) filename += '.yaml';
            const blob = new Blob([currentYamlString], {type: 'text/yaml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
        
        copyBtn.addEventListener('click', async () => {
            if (!currentYamlString || currentYamlString === '等待转换...') { showError('无YAML可复制'); return; }
            try {
                await navigator.clipboard.writeText(currentYamlString);
                const original = copyBtn.textContent;
                copyBtn.textContent = '✅ 已复制！';
                setTimeout(() => copyBtn.textContent = original, 1500);
            } catch { showError('复制失败'); }
        });

        askBtn.addEventListener('click', async () => {
            const question = askInput.value.trim();
            if (!question) return alert('请输入问题');
            if (!currentYamlString || currentYamlString === '等待转换...') return alert('请先转换小说');
            if (!currentHistoryId) return alert('请重新转换或加载历史');
            askBtn.disabled = true;
            answerBox.style.display = 'block';
            answerBox.innerHTML = '<div style="color: #f39c12;">⏳ 思考中...</div>';
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, current_yaml: currentYamlString })
                });
                const data = await res.json();
                if (res.ok) {
                    let html = `<div><strong>📝 回答：</strong><br>${escapeHtml(data.answer).replace(/\n/g, '<br>')}</div>`;
                    let hasYaml = false;
                    if (data.has_yaml && data.new_yaml) {
                        pendingNewYaml = data.new_yaml;
                        html += `<div style="margin-top:8px;"><button id="applyYamlBtn" class="apply-btn">✨ 应用修改后的YAML</button></div>`;
                        hasYaml = true;
                    }
                    answerBox.innerHTML = html;
                    addConversationToCurrent(question, data.answer || '', data.has_yaml ? data.new_yaml : null);
                    if (hasYaml) {
                        document.getElementById('applyYamlBtn')?.addEventListener('click', () => {
                            if (pendingNewYaml) {
                                setYamlContent(pendingNewYaml);
                                updateHistoryYaml(currentHistoryId, currentYamlString);
                                pendingNewYaml = null;
                                const span = document.createElement('div');
                                span.style.color = '#27ae60';
                                span.innerText = '✅ 已应用并更新历史';
                                answerBox.appendChild(span);
                                setTimeout(() => span.remove(), 2000);
                            }
                        });
                    }
                } else answerBox.innerHTML = `<div class="error">❌ ${escapeHtml(data.error)}</div>`;
            } catch (err) {
                answerBox.innerHTML = `<div class="error">请求失败: ${err.message}</div>`;
            } finally { askBtn.disabled = false; }
        });

        renderHistory();
        // 初始占位
        setYamlContent('等待转换...');
    </script>
</body>
</html>
