<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel2Script - 小说转剧本工具</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .sub {
            color: #5a6e7c;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            padding-left: 12px;
        }
        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        .left-panel, .right-panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: auto;
        }
        .left-panel { flex: 1; }
        .right-panel { flex: 1; }
        .panel-title {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        textarea {
            width: 100%;
            flex: 1;
            font-family: 'Courier New', monospace;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .file-upload {
            margin: 10px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-upload input[type="file"] {
            flex: 1;
        }
        .mode-check {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            margin-right: 10px;
        }
        button:hover { background: #2980b9; }
        .export-btn { background: #2ecc71; }
        .export-btn:hover { background: #27ae60; }
        .clear-btn { background: #e67e22; }
        .clear-btn:hover { background: #d35400; }
        .error {
            color: #e74c3c;
            background: #fef3f2;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
        }
        .info {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            color: #3b4e5e;
        }
        .loading {
            display: inline-block;
            margin-left: 10px;
            color: #f39c12;
        }
        .yaml-output {
            background: #1e293b;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            overflow: auto;
            white-space: pre-wrap;
            flex: 1;
            margin-bottom: 15px;
        }
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        hr { margin: 15px 0; }
    </style>
</head>
<body>
    <h1>📖 Novel2Script · AI 小说转剧本工具</h1>
    <div class="sub">基于智谱 GLM-4.5-Air，将小说（≥3章）转换为结构化 YAML 剧本</div>

    <div class="main-container">
        <!-- 左侧：导入区 -->
        <div class="left-panel">
            <div class="panel-title">📂 1. 导入小说</div>
            <textarea id="inputText" placeholder="请在此粘贴至少包含3章的小说内容（支持第X章格式）..."></textarea>
            
            <div class="file-upload">
                <input type="file" id="fileInput" multiple accept=".txt,.md,.docx">
                <button id="loadFileBtn">📄 加载文件内容</button>
                <label class="mode-check">
                    <input type="checkbox" id="appendMode"> 📎 追加到当前内容后
                </label>
                <button id="clearTextBtn" class="clear-btn">🗑️ 清空文本框</button>
            </div>

            <div class="action-bar">
                <div>
                    <button id="convertBtn">✨ 转换为剧本 YAML</button>
                    <span id="loadingMsg" class="loading"></span>
                </div>
            </div>
            <div id="errorMsg" class="error" style="display:none;"></div>
            <div class="info">
                <strong>💡 要求</strong><br>
                • 至少包含3个章节（如“第一章、第二章、第三章”）<br>
                • 输出格式符合预定义剧本Schema<br>
                • 转换耗时约10-20秒，请耐心等待<br>
                • 支持 .txt, .md, .docx 格式，可多选文件（按顺序加载）
            </div>
        </div>

        <!-- 右侧：输出区 -->
        <div class="right-panel">
            <div class="panel-title">🎬 2. 剧本输出 (YAML)</div>
            <div id="yamlOutput" class="yaml-output">等待转换...</div>
            <div class="action-bar">
                <button id="exportBtn" class="export-btn" disabled>💾 导出 YAML 文件</button>
                <button id="copyBtn">📋 复制到剪贴板</button>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const loadFileBtn = document.getElementById('loadFileBtn');
        const clearTextBtn = document.getElementById('clearTextBtn');
        const appendModeCheck = document.getElementById('appendMode');
        const convertBtn = document.getElementById('convertBtn');
        const yamlOutputDiv = document.getElementById('yamlOutput');
        const exportBtn = document.getElementById('exportBtn');
        const copyBtn = document.getElementById('copyBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsgDiv = document.getElementById('errorMsg');
        
        let currentYamlString = '';

        // 清空文本框
        clearTextBtn.addEventListener('click', () => {
            inputText.value = '';
            showError('', true);
        });

        // 辅助函数：读取单个文件（支持 .txt/.md 直接读，.docx 走后端）
        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
                if (ext === '.txt' || ext === '.md') {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('文件读取失败'));
                    reader.readAsText(file, 'UTF-8');
                } else if (ext === '.docx') {
                    const formData = new FormData();
                    formData.append('file', file);
                    fetch('/parse_docx', { method: 'POST', body: formData })
                        .then(res => res.json())
                        .then(data => {
                            if (data.text) resolve(data.text);
                            else reject(new Error(data.error || '解析docx失败'));
                        })
                        .catch(err => reject(err));
                } else {
                    reject(new Error('不支持的文件类型'));
                }
            });
        }

        // 加载文件内容：无论替换还是追加，都将所有选中的文件内容按顺序拼接
        loadFileBtn.addEventListener('click', async () => {
            const files = Array.from(fileInput.files);
            if (files.length === 0) {
                showError('请先选择文件');
                return;
            }

            // 依次读取所有文件内容
            let allText = '';
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    let content = await readFileContent(file);
                    // 每个文件内容后加一个换行（避免粘连）
                    if (content && !content.endsWith('\n')) content += '\n';
                    allText += content;
                } catch (err) {
                    showError(`读取文件 "${file.name}" 失败: ${err.message}`);
                    return;
                }
            }

            // 去掉最后一个多余的换行（如果有）
            if (allText.endsWith('\n')) allText = allText.slice(0, -1);

            if (appendModeCheck.checked) {
                // 追加模式：在原内容后添加（如果原内容非空且末尾没有换行，先加换行）
                let current = inputText.value;
                if (current && !current.endsWith('\n')) current += '\n';
                inputText.value = current + allText;
            } else {
                // 替换模式：清空后填入所有文件拼接的内容
                inputText.value = allText;
            }
            showError('', true);
        });
        
        // 转换（原有逻辑，无变化）
        convertBtn.addEventListener('click', async () => {
            const novel = inputText.value.trim();
            if (!novel) {
                showError('请输入小说内容或通过文件导入');
                return;
            }
            
            const chapterMatches = novel.match(/第[一二三四五六七八九十0-9]+章/g);
            const uniqueChapters = chapterMatches ? new Set(chapterMatches).size : 0;
            
            async function sendConversion(force = false) {
                loadingMsg.textContent = '转换中（约15秒）...';
                convertBtn.disabled = true;
                showError('', true);
                yamlOutputDiv.textContent = '⏳ 正在调用 AI 模型，请稍候...';
                currentYamlString = '';
                exportBtn.disabled = true;
                
                const formData = new FormData();
                formData.append('novel_text', novel);
                if (force) formData.append('force_convert', 'true');
                
                try {
                    const response = await fetch('/convert', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (response.ok && data.yaml) {
                        currentYamlString = data.yaml;
                        yamlOutputDiv.textContent = currentYamlString;
                        exportBtn.disabled = false;
                        showError('', true);
                    } else {
                        if (data.error_type === 'insufficient_chapters') {
                            const userConfirmed = confirm(`⚠️ ${data.error}\n\n是否仍要继续转换？（转换效果可能不佳）`);
                            if (userConfirmed) await sendConversion(true);
                            else {
                                yamlOutputDiv.textContent = '❌ 已取消转换';
                                showError(data.error);
                            }
                        } else {
                            throw new Error(data.error || '转换失败');
                        }
                    }
                } catch (err) {
                    yamlOutputDiv.textContent = `❌ 错误：${err.message}`;
                    showError(err.message);
                    exportBtn.disabled = true;
                } finally {
                    loadingMsg.textContent = '';
                    convertBtn.disabled = false;
                }
            }
            
            if (uniqueChapters >= 3) await sendConversion(false);
            else {
                const userConfirm = confirm(`检测到 ${uniqueChapters} 个不同章节，建议至少3章以获得更好效果。\n\n是否仍要继续转换？`);
                if (userConfirm) await sendConversion(true);
                else showError('已取消转换，请添加更多章节（至少3章）');
            }
        });
        
        exportBtn.addEventListener('click', () => {
            if (!currentYamlString) return;
            const blob = new Blob([currentYamlString], {type: 'text/yaml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script.yaml';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
        
        copyBtn.addEventListener('click', async () => {
            if (!currentYamlString) {
                showError('没有可复制的 YAML 内容');
                return;
            }
            try {
                await navigator.clipboard.writeText(currentYamlString);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ 已复制！';
                setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
            } catch (err) {
                showError('复制失败，手动选择即可');
            }
        });
        
        function showError(msg, clear = false) {
            if (clear || !msg) {
                errorMsgDiv.style.display = 'none';
                errorMsgDiv.textContent = '';
            } else {
                errorMsgDiv.textContent = msg;
                errorMsgDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
